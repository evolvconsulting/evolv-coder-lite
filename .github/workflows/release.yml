name: release

# Publishes src/ to npm as @evolvconsulting/evolv-coder-lite when a
# version tag is pushed. v1.2.0 (ADR-0174) retired the standalone SDK
# package boundary; the tools binary now ships inside the main package
# at evolv-coder-lite/bin/ecl-tools.cjs, so there is a single package to
# publish.
#
# Trigger: `git tag v<X.Y.Z> && git push --tags`
# The tag's <X.Y.Z> must match src/package.json's version exactly, or
# the workflow fails fast (prevents accidentally publishing the wrong
# version).
#
# Requires repo secret NPM_TOKEN (npm automation token with publish
# rights to the @evolvconsulting scope).

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'If true, run npm publish --dry-run instead of publishing'
        required: false
        default: 'false'

permissions:
  # `contents: write` is required by the "Create GitHub Release" step below
  # (gh release create/edit). The publish steps themselves only read.
  contents: write
  # NOTE: id-token: write is needed only for `npm publish --provenance`.
  # Provenance was removed because the npm account's 2FA-on-writes setting
  # blocked it (EOTP from GitHub Actions). Sibling @evolvconsulting packages
  # publish without provenance for the same reason. Re-add this permission
  # plus --provenance to both steps below if/when the 2FA setting changes.

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          # Match upstream's NODE_VERSION (24) — upstream's release pins to 24.
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      # ── Pre-publish gates ──────────────────────────────────────────────
      # Each gate fails the workflow before any tarball is published.
      # Order is cheapest-first: rebrand and bake-freshness checks before
      # any npm install runs, so a leak fails in seconds rather than minutes.

      - name: Verify rebrand (no leaks)
        run: node scripts/verify-rebrand.mjs

      - name: Confirm src/ matches a fresh bake
        run: |
          node overlay/bake.mjs
          if [ -n "$(git status --porcelain -- 'src/' ':!src/REBRAND-MANIFEST.json')" ]; then
            echo "::error::src/ does not match a fresh bake. Re-run 'npm run build' locally and commit before tagging."
            git status --short -- 'src/' ':!src/REBRAND-MANIFEST.json'
            exit 1
          fi

      - name: Cross-check tag against parent package version
        if: github.event_name == 'push'
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          PKG_VERSION=$(node -p "require('./src/package.json').version")
          if [ "$TAG" != "$PKG_VERSION" ]; then
            echo "::error::Tag v$TAG does not match src/package.json version $PKG_VERSION."
            echo "Either retag, or bump src/package.json (via overlay/package.patch.json) and re-bake first."
            exit 1
          fi
          echo "Tag and parent package.json version both at $PKG_VERSION."

      - name: Install src/ dependencies
        working-directory: src
        run: npm ci || npm install --no-audit --no-fund

      - name: Production audit (parent)
        working-directory: src
        run: npm audit --omit=dev --audit-level=moderate

      - name: Run unit test suite
        working-directory: src
        run: node scripts/run-tests.cjs --suite unit

      - name: Build hooks + package identity before tarball smoke
        # release-tarball-smoke.cjs packs the parent and exercises the installed
        # ecl-tools binary. The parent's hooks/ dir and package identity are
        # populated by `npm run build` (generate:identity + build:hooks), NOT by
        # the bake — and `npm pack` does NOT run prepublishOnly (npm 7+). So we
        # must build here before the smoke packs, or the tarball ships without
        # hooks/ and the smoke runs against an incomplete package.
        working-directory: src
        run: npm run build

      - name: Release tarball smoke
        working-directory: src
        run: node scripts/release-tarball-smoke.cjs

      - name: Pack-contents check (README links resolve)
        run: node scripts/check-pack-contents.mjs

      # ── Publish gate ───────────────────────────────────────────────────
      # Single package: @evolvconsulting/evolv-coder-lite. v1.2.0 (ADR-0174)
      # retired the standalone SDK package boundary — the tools binary now
      # ships inside this package, so there is nothing else to publish.

      - name: Publish parent to npm (dry-run)
        if: inputs.dry_run == 'true'
        working-directory: src
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --dry-run --access public

      - name: Publish parent to npm
        if: github.event_name == 'push' || inputs.dry_run != 'true'
        working-directory: src
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public

      # ── GitHub Release ─────────────────────────────────────────────────
      # On a successful version-tag push, publish a GitHub Release so the tag
      # carries human-readable notes alongside the npm publish. Body source,
      # in order of preference:
      #   1. the matching `## [X.Y.Z]` section of src/CHANGELOG.md, if present
      #   2. the annotated tag's own message
      # Idempotent: edits the release if one already exists for the tag, so a
      # re-run (or a manually pre-created release) never fails the workflow.
      - name: Create GitHub Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          NOTES_FILE="$(mktemp)"

          # 1) Try the matching CHANGELOG section: everything between the
          #    `## [VERSION]` heading and the next `## [` heading.
          if [ -f src/CHANGELOG.md ]; then
            awk -v v="$VERSION" '
              $0 ~ "^## \\[" v "\\]" { capture = 1; next }
              capture && /^## \[/   { exit }
              capture               { print }
            ' src/CHANGELOG.md > "$NOTES_FILE"
          fi

          # 2) Fall back to the annotated tag message.
          if [ -s "$NOTES_FILE" ]; then
            echo "Release notes: src/CHANGELOG.md section [$VERSION]"
          else
            echo "No CHANGELOG section for $VERSION — using tag annotation"
            git tag -l --format='%(contents)' "$TAG" > "$NOTES_FILE"
          fi

          # 3) Rebrand the notes. src/CHANGELOG.md is content-preserved by the
          #    bake (it keeps upstream's gsd-core / @opengsd / /gsd: wording), so
          #    rewrite through the rebrand map before publishing the release.
          #    A non-content-preserved rel ('release-notes.md') makes the rules
          #    apply; on already-eCL text (e.g. a tag annotation) it is a no-op.
          node -e '
            import("./overlay/rebrand-map.mjs").then((m) => {
              const fs = require("fs");
              const f = process.argv[1];
              const out = m.rebrandContent(fs.readFileSync(f, "utf8"), "release-notes.md");
              fs.writeFileSync(f, out.text);
            }).catch((e) => { console.error(e); process.exit(1); });
          ' "$NOTES_FILE"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "eCL $TAG" --notes-file "$NOTES_FILE"
            echo "Updated existing GitHub Release $TAG"
          else
            gh release create "$TAG" --title "eCL $TAG" --notes-file "$NOTES_FILE" --verify-tag
            echo "Created GitHub Release $TAG"
          fi
